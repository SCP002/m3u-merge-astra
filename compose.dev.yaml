services:
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    image: m3u-merge-astra-dev
    init: true
    command: sleep infinity
    working_dir: /workspace
    volumes:
      - .:/workspace:cached
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
      - ${ASTRA_BIN:-astra_bin}:/workspace/.dev:cached
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

volumes:
  astra_bin:
  go_mod_cache:
  go_build_cache:
